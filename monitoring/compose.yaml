services:
  prometheus:
    image: prom/prometheus:latest
    container_name: petcare-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
      - postgres-exporter
    networks:
      - petcare-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: petcare-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Copy .env.example to .env and set a strong Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - petcare-monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: petcare-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - petcare-monitoring

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: petcare-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_HOST:-host.docker.internal:5432}/${POSTGRES_EXPORTER_DB:-postgres}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:?Set POSTGRES_EXPORTER_USER in monitoring/.env}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?Set POSTGRES_EXPORTER_PASSWORD in monitoring/.env}
    ports:
      - "9187:9187"
    networks:
      - petcare-monitoring

networks:
  petcare-monitoring:
    name: petcare-monitoring

volumes:
  prometheus_data:
  grafana_data:
